name: CT.gov revision comparison tests
on:
  push:
  pull_request:
jobs:
  history-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -p 'test_history_diff.py' -v
